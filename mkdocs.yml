site_name: AI Innovation Hub Docs
site_description: Documentation for AI Innovation Hub (JNTUGV Hackathon Dec 2025)
site_url: https://monkey9-cyber-cat-spidy.github.io/jntugv-hackathon-dec-2025-Team-85/
repo_url: https://github.com/monkey9-Cyber-cat-Spidy/jntugv-hackathon-dec-2025-Team-85
repo_name: monkey9-Cyber-cat-Spidy/jntugv-hackathon-dec-2025-Team-85
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Docs Index: overview.md
  - Product UX:
    - Floating Chatbot: chatbot.md
    - Multi-prompt stylings: multi_prompt_stylings.md
  - Architecture: ARCHITECTURE.md
  - Runbook: RUNBOOK.md
  - Evaluation: EVALUATION_NOTES.md
  - Sources: SOURCES.md
